
name: Build SOTN64 ROM

on:
  workflow_dispatch:
  push:
    branches: [main]
    
permissions:
  contents: read
  packages: read
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Libdragon
        run: npm install -g libdragon
      
      - name: Iniciar sesión en GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar entorno Libdragon
        run: docker pull --platform linux/amd64 ghcr.io/dragonminded/libdragon:latest

      - name: Inicializar proyecto temporal
        run: |
          mkdir -p "$RUNNER_TEMP/sotn64"
          cd "$RUNNER_TEMP/sotn64"
          git init
          libdragon init

      - name: Copiar nuestro código
        run: |
          cp "$GITHUB_WORKSPACE/src/main.c" "$RUNNER_TEMP/sotn64/src/main.c"

      - name: Compilar ROM
        run: |
          cd "$RUNNER_TEMP/sotn64"
          libdragon make
          find . -name "*.z64" -print

      - name: Guardar ROM
        uses: actions/upload-artifact@v4
        with:
          name: SOTN64-ROM
          path: ${{ runner.temp }}/sotn64/**/*.z64
          if-no-files-found: error

